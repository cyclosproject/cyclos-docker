# DOMAIN is passed through from docker-compose.yaml. When it is empty, the
# router falls back to a plain-HTTP catch-all on the web entrypoint and no
# Let's Encrypt certificate is requested. Traefik renders Go templates in
# dynamic configuration files (https://doc.traefik.io/traefik/providers/file/).
http:
  routers:
    cyclos-router:
      rule: '{{ if env "DOMAIN" }}Host(`{{ env "DOMAIN" }}`){{ else }}PathPrefix(`/`){{ end }}'
      entryPoints:
        - '{{ if env "DOMAIN" }}websecure{{ else }}web{{ end }}'
      service: cyclos-svc
      {{ if env "DOMAIN" }}
      tls:
        certResolver: le
      {{ end }}

  services:
    cyclos-svc:
      loadBalancer:
        serversTransport: cyclos-transport
        servers:
          - url: "http://cyclos:8080"

  serversTransports:
    cyclos-transport:
      forwardingTimeouts:
        dialTimeout: 30s
        responseHeaderTimeout: 600s
        idleConnTimeout: 600s
