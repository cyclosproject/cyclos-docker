name: cyclos

services:
  cyclos:
    image: docker.io/cyclos/cyclos:${CYCLOS_VERSION}
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME:-cyclos}
      DB_USER: ${DB_USER:-cyclos}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CLUSTER_DNS: cyclos # Same as service name for internal DNS resolution
      JAVA_OPTS: >-
        -Xmx${MAX_JVM_MEMORY:-4096m}
        -Dcyclos.header.remoteAddress=X-Forwarded-For
        -Dcyclos.header.protocol=X-Forwarded-Proto
        -Dcyclos.header.remoteAddress.index=-1
        -Dcyclos.log=console
        # Database TLS options (Zero Trust starting point - uncomment if enforcing encrypted DB traffic):
        # -Dcyclos.datasource.dataSource.ssl=true
        # -Dcyclos.datasource.dataSource.sslmode=verify-full
        # -Dcyclos.datasource.dataSource.sslrootcert=/run/secrets/db_ca_cert
    deploy:
      mode: replicated
      replicas: ${REPLICAS:-1}
      endpoint_mode: dnsrr # Required for CLUSTER_DNS to work
      placement:
        max_replicas_per_node: 1
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host # External LoadBalancer distributes traffic here; restrict host access via firewall/security groups
    networks:
      cyclos-net:
    secrets:
      - db_password
      # Optional: Database CA certificate for SSL verification (uncomment if used)
      # - db_ca_cert

networks:
  cyclos-net:
    driver: overlay
    # Encrypt inter-node container traffic using IPsec (Zero Trust best practice)
    driver_opts:
      encrypted: "true"

secrets:
  # Assumes the secret `db_password` is created in the Swarm (external)
  db_password:
    external: true
  # Optional: Database CA certificate for SSL verification
  # db_ca_cert:
  #   external: true
